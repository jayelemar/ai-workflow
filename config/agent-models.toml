schema_version = 2
source_url = "https://developers.openai.com/api/docs/models.md"

[tiers.frontier]
model = "gpt-5.6-sol"

[tiers.balanced]
model = "gpt-5.6-terra"

[tiers.efficient]
model = "gpt-5.6-luna"

[roles.parent]
tier = "balanced"
reasoning_effort = "high"
elevated_reasoning_effort = "xhigh"
elevate_when = "security-critical, migration, destructive, or materially ambiguous architecture work"

[roles.scout]
tier = "balanced"
reasoning_effort = "high"

[roles.builder]
tier = "efficient"
reasoning_effort = "xhigh"
retry_tier = "balanced"
retry_reasoning_effort = "high"
retry_limit = 1

[roles.reviewer]
tier = "frontier"
reasoning_effort = "xhigh"

[stages.specification]
tier = "frontier"
reasoning_effort = "high"

[stages.planning]
tier = "frontier"
reasoning_effort = "high"

[spawn]
fork_turns = 4
name_format = "{role}_{model_family}_{reasoning_effort}_{purpose}"
